name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
      - name: 公開ファイルを配置(index.html のみ)
        run: |
          mkdir -p _site
          cp index.html _site/
      - name: Pages アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
